[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a3-provenance-aware-rag-evaluation"
version = "1.0.0"
description = "Bounded provenance-aware RAG and semantic-search evaluation"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
